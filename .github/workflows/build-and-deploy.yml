name: Build and Deploy

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Build Docker image
      run: docker build -t devops-app:${{ github.sha }} -f app/Dockerfile app/
    
    - name: Test endpoints
      run: |
        docker run -d -p 5000:5000 -e ENVIRONMENT=ci devops-app:${{ github.sha }}
        sleep 2
        curl http://localhost:5000/
        curl http://localhost:5000/health
